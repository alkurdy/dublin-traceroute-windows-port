name: CI & Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run Unit Tests with Coverage
        run: go test -v -coverprofile coverage.out ./...

      - name: Build Windows Executable
        run: |
          go build -v -ldflags="-s -w" -o dublin-traceroute.exe ./cmd/dublin-traceroute
          ./dublin-traceroute.exe -version

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dublin-traceroute-windows-amd64
          path: dublin-traceroute.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dublin-traceroute.exe
          name: Dublin Traceroute for Windows ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
